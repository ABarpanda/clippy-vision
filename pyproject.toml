[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Clippy_Vision"
version = "0.1.0"

# Add this section below to handle the flat layout
[tool.setuptools.packages.find]
where = ["."]  # Look in the root directory
include = ["core*", "classifier*", "agent*"]  # Explicitly include these directories

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["I", "UP", "E", "F", "B"]

ignore = [
    "E501", # Line too long
    "E402", # Module level import not at top of file
    "F401", # {Module} imported but unused
    "F541", # f-string without any placeholders
    "B905", # `zip()` without an explicit `strict=` parameter
    "B007", # Loop control variable {var} not used within loop body
]